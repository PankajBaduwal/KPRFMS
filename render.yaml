services:
  - type: web
    name: facultycore-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SAME_SITE
        value: none
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: TWO_FACTOR_KEY
        generateValue: true
      - key: DEMO_LOGIN_ENABLED
        value: "true"
