services:
  - type: web
    name: facultycore-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: "1"
      - key: COOKIE_SAME_SITE
        value: none
      - key: MONGODB_URI
        sync: false
      # The site address(es) allowed to call the API, e.g. https://your-app.vercel.app (comma-separated, exact)
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: TWO_FACTOR_KEY
        generateValue: true
      # One-click demo accounts for institutions. Set to "false" once real staff use the site.
      # Super Admin one-click (DEMO_PLATFORM_LOGIN_ENABLED) is deliberately not set: it stays off here.
      - key: DEMO_LOGIN_ENABLED
        value: "true"

