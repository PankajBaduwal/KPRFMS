name: CI

on:
  push:
  pull_request:

jobs:
  # TEMPORARY: which MongoDB images start on the current runner kernel (SERVER-121912)
  mongo-probe:
    name: Probe — MongoDB versions on this runner
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::notice title=kernel::$(uname -r)"
          for img in mongo:7.0 mongo:8.0 mongo:8.2 mongo:latest; do
            name=probe-$(echo $img | tr ':.' '--')
            docker run -d --name $name $img >/dev/null 2>&1 || { echo "::warning title=probe::$img => pull/run failed"; continue; }
            ok=fail
            for i in $(seq 1 20); do
              if docker exec $name mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; then ok=ok; break; fi
              sleep 2
            done
            ver=$(docker exec $name mongod --version 2>/dev/null | head -1)
            echo "::warning title=probe::$img => $ok ($ver)"
            docker rm -f $name >/dev/null 2>&1
          done
  client:
    name: Web app — type-check, lint, build
    # ubuntu-latest moved to Linux 6.19+, which MongoDB 8.0 refuses to run on (SERVER-121912)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build # tsc -b && vite build
      - run: npx oxlint

  server:
    name: API — type-check, build, test suites (two isolated institutions)
    # ubuntu-latest moved to Linux 6.19+, which MongoDB 8.0 refuses to run on (SERVER-121912)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    env:
      # Throwaway values for this job only; the test runner never touches non-test databases
      NODE_ENV: development
      MONGODB_URI: mongodb://localhost:27017/facultycore-ci
      TEST_MONGODB_URI: mongodb://localhost:27017/facultycore-test
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-000000
      COOKIE_SECRET: ci-only-cookie-secret-not-used-anywhere-else-00
      CLIENT_URL: http://localhost:5180
      # Tests never call the paid AI service
      GEMINI_API_KEY: ''
    steps:
      # MongoDB started explicitly (not as a service container) so a start-up problem is reported
      - name: Start MongoDB 8.0
        working-directory: .
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.0
          for i in $(seq 1 60); do
            if docker exec mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; then echo "MongoDB is up"; exit 0; fi
            sleep 2
          done
          docker logs mongo 2>&1 | tail -25 | sed 's/^/::error title=mongod::/'
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # API plus the operational tools shipped in the image (dist/scripts)
      - run: npm run build
      # Registers institutions "testa" and "testb" in fctest_* databases, seeds them, starts a
      # private API and runs every suite, including the cross-institution attack suites
      - run: npm test
      - name: Keep the test API log when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-api-log
          path: server/test-api.log
          if-no-files-found: ignore
      - name: Show the end of the test API log
        if: failure()
        working-directory: .
        run: test -f server/test-api.log && tail -40 server/test-api.log | sed 's/^/::error title=test-api::/' || true

  docker:
    name: Docker — build images and start the stack
    # ubuntu-latest moved to Linux 6.19+, which MongoDB 8.0 refuses to run on (SERVER-121912)
    runs-on: ubuntu-24.04
    # Throwaway values; every compose command below needs them
    env:
      JWT_SECRET: ci-only-jwt-secret-for-the-compose-smoke-test-0000
      COOKIE_SECRET: ci-only-cookie-secret-for-the-compose-smoke-test-00
      TWO_FACTOR_KEY: ci-only-two-factor-key-for-the-compose-smoke-test-0
      CLIENT_URL: http://localhost:8080
      WEB_PORT: '8080'
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start the stack and wait until healthy
        run: docker compose up -d --wait --wait-timeout 180
      - name: Readiness through nginx (database, registry, institutions)
        run: |
          curl -fsS http://localhost:8080/api/health/ready
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8080/
      - name: Operational tools are present in the image
        run: docker compose exec -T server sh -c 'ls dist/scripts/platform-create-admin.js dist/scripts/backup.js dist/scripts/restore.js'
      - name: Logs when something fails
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200
          docker compose logs --no-color --tail 15 mongo server | sed 's/^/::error title=compose::/'
      - name: Stop
        if: always()
        run: docker compose down -v
